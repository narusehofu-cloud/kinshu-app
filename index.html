<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金種計算機 V4</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
            max-width: 500px;
            margin: auto;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .currency-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px; 
        }
        .item-label {
            flex-grow: 1;
            min-width: 120px;
        }
        .currency-item input {
            width: 80px;
            padding: 5px;
            text-align: right;
            box-sizing: border-box;
        }
        .item-subtotal {
            width: 120px;
            text-align: right;
            font-size: 0.9em;
            color: #555;
            padding: 5px 0;
        }
        .total-area {
            margin-top: 20px;
            padding-top: 10px;
            border-top: 2px solid #ddd;
            font-size: 1.2em;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
        .button-area {
            margin-top: 15px;
            text-align: right;
        }
        .clear-button {
            padding: 8px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .clear-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>金種計算</h1>
        
        <!-- 各行の初期値(value)を空欄に変更 -->
        <div class="currency-item">
            <span class="item-label">10,000円札</span>
            <input type="number" min="0" value="" id="c10000" oninput="calculate()">
            <span class="item-subtotal" id="subtotal-10000"></span>
        </div>
        <div class="currency-item">
            <span class="item-label">5,000円札</span>
            <input type="number" min="0" value="" id="c5000" oninput="calculate()">
            <span class="item-subtotal" id="subtotal-5000"></span>
        </div>
        <div class="currency-item">
            <span class="item-label">2,000円札</span>
            <input type="number" min="0" value="" id="c2000" oninput="calculate()">
            <span class="item-subtotal" id="subtotal-2000"></span>
        </div>
        <div class="currency-item">
            <span class="item-label">1,000円札</span>
            <input type="number" min="0" value="" id="c1000" oninput="calculate()">
            <span class="item-subtotal" id="subtotal-1000"></span>
        </div>
        <div class="currency-item">
            <span class="item-label">500円玉</span>
            <input type="number" min="0" value="" id="c500" oninput="calculate()">
            <span class="item-subtotal" id="subtotal-500"></span>
        </div>
        <div class="currency-item">
            <span class="item-label">100円玉</span>
            <input type="number" min="0" value="" id="c100" oninput="calculate()">
            <span class="item-subtotal" id="subtotal-100"></span>
        </div>
        <div class="currency-item">
            <span class="item-label">50円玉</span>
            <input type="number" min="0" value="" id="c50" oninput="calculate()">
            <span class="item-subtotal" id="subtotal-50"></span>
        </div>
        <div class="currency-item">
            <span class="item-label">10円玉</span>
            <input type="number" min="0" value="" id="c10" oninput="calculate()">
            <span class="item-subtotal" id="subtotal-10"></span>
        </div>
        <div class="currency-item">
            <span class="item-label">5円玉</span>
            <input type="number" min="0" value="" id="c5" oninput="calculate()">
            <span class="item-subtotal" id="subtotal-5"></span>
        </div>
        <div class="currency-item">
            <span class="item-label">1円玉</span>
            <input type="number" min="0" value="" id="c1" oninput="calculate()">
            <span class="item-subtotal" id="subtotal-1"></span>
        </div>

        <div class="total-area">
            <span>合計金額:</span>
            <span id="total">0 円</span>
        </div>

        <div class="button-area">
            <button class="clear-button" onclick="clearInputs()">入力をクリア</button>
        </div>
    </div>

    <script>
        // ここが抜けていました: 金種リストを定義し直します
        const denominations = [10000, 5000, 2000, 1000, 500, 100, 50, 10, 5, 1];

        function calculate() {
            let totalAmount = 0;
            
            denominations.forEach(value => {
                const inputElement = document.getElementById(`c${value}`);
                const subtotalElement = document.getElementById(`subtotal-${value}`);
                
                const count = parseInt(inputElement.value, 10) || 0;
                const subtotal = count * value;
                
                subtotalElement.textContent = subtotal === 0 ? "" : subtotal.toLocaleString() + " 円";
                
                totalAmount += subtotal;
            });
            
            document.getElementById('total').textContent = totalAmount.toLocaleString() + " 円";
        }

        function clearInputs() {
            denominations.forEach(value => {
                document.getElementById(`c${value}`).value = ''; 
            });
            calculate();
        }

        calculate();
    </script>
</body>
</html>
